# autogenerated = 1 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
# Layout (all connected):
#   HDMI-A-1   3840x2160  auto (above row when present)
#   DP-3       1440x900   pos 0x0    rotate left
#   DP-1       2560x1440  pos 900x0  primary
#   DP-2       1024x768   pos 3460x0
monitor=HDMI-A-1,3840x2160@60,auto,1
monitor=DP-1,2560x1440@164,768x0,1
monitor=DP-2,1024x768@60,0x0,1,transform,1
monitor=DP-3,1440x900@60,3328x0,1
monitor=,preferred,auto,1
# monitor=,addreserved,0,0,85,0  # replaced by layer-shell exclusive zone in ags-2.0
# See https://wiki.hyprland.org/Configuring/Keywords/ for more

exec-once=$HOME/.config/hypr/scripts/hooks/window-opened.sh
exec-once=mpvpaper -o 'no-audio hwdec=vaapi gpu-api=vulkan loop-file=inf keepaspect=no vf=fps=30 prefetch-playlist=no demuxer-max-bytes=32M demuxer-max-back-bytes=4M cache=no scale=bilinear cscale=bilinear dscale=bilinear vd-lavc-threads=2 video-sync=display-vdrop input-ipc-server=/tmp/mpv-socket script=/home/js/.config/mpv/scripts/wallpaper-timer.lua' '*' /home/js/documents/wallpapers/animated/playlist.m3u
exec-once=$HOME/.config/hypr/scripts/mpvpaper-pause-fullscreen.sh
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=$HOME/.customscripts/alert-daemon.sh
exec-once=ags run $HOME/.config/dotfiles/ags-2.0/app.ts
exec-once=$HOME/.config/wacom/init.sh

plugin:nstack {
  layout {
    orientation=left
      new_on_top=0
      new_is_master=1
      no_gaps_when_only=0
      special_scale_factor=0.8
      inherit_fullscreen=1
      stacks=4
      mfact=0
  }
}

input {
}

# Some default env vars.
env = XCURSOR_SIZE,16

misc {
  disable_hyprland_logo = true;
}


# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    numlock_by_default = true

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 7
    gaps_out = 20
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(00000000)
    layout = master
    no_focus_fallback = true
    resize_on_border = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
        xray = false
    }

    # drop_shadow = yes
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
    active_opacity = 0.97
    inactive_opacity = 0.90
    fullscreen_opacity = 1
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes # you probably want this
}

# master {
#     # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#     new_is_master = false
# }

# Enable touchpad gestures
# gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device:epic-mouse-v1 {
  # sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Transparency excludes
windowrule = match:class ^(rofi|discord|firefox)$, opacity 1.0 1.0
windowrule = match:class ^(xwaylandvideobridge)$, opacity 0.0 0.0
windowrule = match:class ^(xwaylandvideobridge)$, no_anim true
windowrule = match:class ^(flameshot)$, no_anim true
windowrule = match:class ^(xwaylandvideobridge)$, no_focus true
windowrule = match:class ^(xwaylandvideobridge)$, no_initial_focus true# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more bind =

bind = $mainMod, return, exec, kitty
bind = $mainMod, w, killactive,
bind = $mainMod, q, exec, hyprlock
bind = $mainMod_CONTROL, q, exit,
bind = $mainMod, m, exec, rofi -show-icons -icon-theme Papirus -show drun
bind = $mainMod, d, togglefloating,
bind = $mainMod, b, exec, firefox
bind = $mainMod, s, exec, echo 'cycle pause' | socat - /tmp/mpv-socket
bind = $mainMod_SHIFT, b, exec, google-chrome-stable
bind = $mainMod_SHIFT, s, exec, flameshot gui 
bind = $mainMod_SHIFT, r, exec, $HOME/.config/hypr/scripts/functions/record.sh
bind = $mainMod_SHIFT, c, exec, hyprpicker -a --format=hex
# bind = $mainMod_SHIFT, C, exec, $HOME/.customscripts/light-control pick  # script missing
bind = $mainMod, n, exec, $HOME/.customscripts/next-wallpaper
bind = $mainMod, tab, fullscreen, 1
bind = $mainMod_SHIFT, tab, fullscreen, 0
bind = $mainMod, backspace, exec, ags quit && ags run $HOME/.config/dotfiles/ags-2.0/app.ts
bind = $mainMod_SHIFT, backspace, exec, ags quit
# Move focus with mainMod + jkli
bind = $mainMod, j, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, i, movefocus, u
bind = $mainMod, k, movefocus, d

# Move windows with mainMod + shift + jkli
bind = $mainMod_SHIFT, j, movewindow, l
bind = $mainMod_SHIFT, l, movewindow, r
bind = $mainMod_SHIFT, i, movewindow, u
bind = $mainMod_SHIFT, k, movewindow, d

# Resizing windwos with mainMod + Ctrl + jkli
bind = $mainMod_CONTROL, j, resizeactive, -30 0
bind = $mainMod_CONTROL, k, resizeactive, 0 30
bind = $mainMod_CONTROL, l, resizeactive, 30 0
bind = $mainMod_CONTROL, i, resizeactive, 0 -30

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, grave, exec, $HOME/.config/hypr/scripts/functions/switchworkspace.sh 1
bind = $mainMod, 1, exec, $HOME/.config/hypr/scripts/functions/switchworkspace.sh 2
bind = $mainMod, 2, exec, $HOME/.config/hypr/scripts/functions/switchworkspace.sh 3
bind = $mainMod, 8, exec, $HOME/.config/hypr/scripts/functions/switchworkspace.sh 4
bind = $mainMod, 9, exec, $HOME/.config/hypr/scripts/functions/switchworkspace.sh 5
bind = $mainMod, 0, exec, $HOME/.config/hypr/scripts/functions/switchworkspace.sh 6
bind = $mainMod, minus, exec, $HOME/.config/hypr/scripts/functions/switchworkspace.sh 7
bind = $mainMod, equal, exec, $HOME/.config/hypr/scripts/functions/switchworkspace.sh 8

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, grave, exec, $HOME/.config/hypr/scripts/functions/movetoworkspace.sh 1 silent
bind = $mainMod SHIFT, 1, exec, $HOME/.config/hypr/scripts/functions/movetoworkspace.sh 2 silent
bind = $mainMod SHIFT, 2, exec, $HOME/.config/hypr/scripts/functions/movetoworkspace.sh 3 silent
bind = $mainMod SHIFT, 8, exec, $HOME/.config/hypr/scripts/functions/movetoworkspace.sh 4 silent
bind = $mainMod SHIFT, 9, exec, $HOME/.config/hypr/scripts/functions/movetoworkspace.sh 5 silent
bind = $mainMod SHIFT, 0, exec, $HOME/.config/hypr/scripts/functions/movetoworkspace.sh 6 silent
bind = $mainMod SHIFT, minus, exec, $HOME/.config/hypr/scripts/functions/movetoworkspace.sh 7 silent
bind = $mainMod SHIFT, equal, exec, $HOME/.config/hypr/scripts/functions/movetoworkspace.sh 8 silent

# # Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Function controls
bind = , XF86Calculator, exec, kitty -e python3
binde = , XF86AudioRaiseVolume, exec, pamixer -i 5
binde = , XF86AudioLowerVolume, exec, pamixer -d 5
bindr = , XF86AudioMute, exec, pamixer -t
bindr = , XF86AudioPlay, exec, playerctl play-pause
bindr = , XF86AudioPause, exec, playerctl play-pause
bindr = , XF86AudioNext, exec, playerctl next
bindr = , XF86AudioPrev, exec, playerctl previous
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Plugins
# bind=SUPERSHIFT,U,hyprload,install

# Eww bar script triggers
# Current workspace control
bind = $mainMod, grave, exec, $HOME/.config/hypr/scripts/eww/eww-update-active.sh 0
bind = $mainMod, 1, exec, $HOME/.config/hypr/scripts/eww/eww-update-active.sh 1
bind = $mainMod, 2, exec, $HOME/.config/hypr/scripts/eww/eww-update-active.sh 2
bind = $mainMod, 8, exec, $HOME/.config/hypr/scripts/eww/eww-update-active.sh 3
bind = $mainMod, 9, exec, $HOME/.config/hypr/scripts/eww/eww-update-active.sh 4
bind = $mainMod, 0, exec, $HOME/.config/hypr/scripts/eww/eww-update-active.sh 5
bind = $mainMod, minus, exec, $HOME/.config/hypr/scripts/eww/eww-update-active.sh 6
bind = $mainMod, equal, exec, $HOME/.config/hypr/scripts/eww/eww-update-active.sh 7

# Window movement between workpsaces support
bind = $mainMod SHIFT, grave,exec, $HOME/.config/hypr/scripts/eww/eww-workspaces-move.sh 1
bind = $mainMod SHIFT, 1,exec, $HOME/.config/hypr/scripts/eww/eww-workspaces-move.sh 2
bind = $mainMod SHIFT, 2,exec, $HOME/.config/hypr/scripts/eww/eww-workspaces-move.sh 3
bind = $mainMod SHIFT, 8,exec, $HOME/.config/hypr/scripts/eww/eww-workspaces-move.sh 4
bind = $mainMod SHIFT, 9,exec, $HOME/.config/hypr/scripts/eww/eww-workspaces-move.sh 5
bind = $mainMod SHIFT, 0,exec, $HOME/.config/hypr/scripts/eww/eww-workspaces-move.sh 6
bind = $mainMod SHIFT, minus,exec, $HOME/.config/hypr/scripts/eww/eww-workspaces-move.sh 7
bind = $mainMod SHIFT, equal,exec, $HOME/.config/hypr/scripts/eww/eww-workspaces-move.sh 8
# Other
bind = $mainMod, f, exec, $HOME/.customscripts/stop-alert-daemon.sh
bind = $mainMod, g, exec, ags run $HOME/.config/dotfiles/ags-2.0/app.ts
bind = $mainMod SHIFT, g, exec, ags quit
